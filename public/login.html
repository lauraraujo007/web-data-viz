<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar | Chumseon Space</title>
<!-- Fontes do Google: Montserrat (textos e títulos) e Noto Sans KR (as letras coreanas 춤선) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,800;1,900&family=Noto+Sans+KR:wght@300;700&display=swap" rel="stylesheet">

<!-- CSS: base.css vale para todas as páginas; o segundo é só desta página -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<!-- data-page diz ao CSS e ao js/app.js em qual página estamos -->
<body data-page="login">

<br><br>
<main>
  <div class="auth">
    <div><div class="ko" lang="ko" aria-hidden="true">춤선</div><h1>Que bom ver você</h1><p class="lead">Entre para acompanhar o painel da comunidade e receber dicas do seu estilo.</p></div>
    
    <form class="panel" id="form_login" onsubmit="entrar(); return false;" novalidate>
      <label class="f">E-mail<input id="input_email" name="email" type="email" autocomplete="email"></label>
      <label class="f">Senha<input id="input_senha" name="senha" type="password" autocomplete="current-password"></label>
      <p class="err" id="p_erro_login" role="alert"></p>
      <button class="pill solid" type="submit">Entrar</button>
      <p class="hint">Sem conta? <a href="cadastro.html">Criar conta</a><br>Para testar: demo@chumseon.space, senha 123456.</p>
    </form>
  </div>
</main> <br><br><br>
  <footer><span>© 2026 Chumseon Space</span><span>Projeto Individual SPTech</span></footer>
<div class="toast" id="div_aviso" role="status"></div>

<!-- JS (a ordem importa): dados.js -> app.js -> arquivo da página (que chama iniciarPagina no final) -->
<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
