<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Criar conta | Chumseon Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,800;1,900&family=Noto+Sans+KR:wght@300;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body data-page="cadastro">
    

    <main>
      <div class="auth">
        <div>
          <div class="ko" lang="ko" aria-hidden="true">춤선</div>
          <h1>Crie sua conta</h1>
          <p class="lead">
            Conte como a dança aparece na sua vida. Suas respostas desenham o
            painel da comunidade.
          </p>
        </div>
    </main>
        <!-- FORMULÁRIO DE CADASTRO: o onsubmit chama cadastrar() (js/cadastro.js); o "return false" só impede a página de recarregar. Os botões de escolha (div_opcoes_estilo, div_opcoes_tempo, div_opcoes_sentido) são criados por ele -->
    <main>
        <form class="panel2" id="form_cadastro" onsubmit="cadastrar(); return false;" novalidate>
          <label class="f">Nome<input id="input_nome" name="nome" autocomplete="name" /></label>
          <label class="f"
            >E-mail<input id="input_email" name="email" type="email" autocomplete="email"
          /></label>
          <label class="f"
            >Senha (mínimo 6 caracteres)<input id="input_senha" name="senha" type="password" autocomplete="new-password"
          /></label>
          <fieldset>
            <legend>Estilo que você mais pratica ou quer praticar</legend>
            <div id="div_opcoes_estilo"></div>
          </fieldset>
          <fieldset>
            <legend>Seu contato com a dança</legend>
            <div id="div_opcoes_tempo"></div>
          </fieldset>
          <fieldset>
            <legend>O que a dança representa para você</legend>
            <div id="div_opcoes_sentido"></div>
          </fieldset>
          <p class="err" id="p_erro_cadastro" role="alert"></p>
          <button class="pill solid" type="submit">Criar conta</button>
          <p class="hint">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
      </div>
    </main>
    <footer>
      <span>© 2026 Chumseon Space</span><span>Projeto Individual SPTech</span>
    </footer>
    <div class="toast" id="div_aviso" role="status"></div>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>
